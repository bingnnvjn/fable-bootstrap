name: Build Fable bootstrap (aarch64, apt-android-7)

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: build-fable-bootstrap
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull package builder image
        run: docker pull ghcr.io/termux/package-builder:latest

      - name: Create builder container
        run: ./scripts/run-docker.sh bash -c 'true'

      # The package builder's restricted AppArmor profile denies writes to
      # /home/builder/lib (where the image SDK lives), so Gradle's SDK
      # auto-install for termux-am (platforms;android-33, build-tools;30.0.3)
      # fails. Copy the SDK to a writable path and add the missing components
      # there; the build step then points ANDROID_HOME at the copy.
      - name: Prepare writable Android SDK with termux-am components
        run: |
          docker exec -u root termux-package-builder bash -c '
            set -euo pipefail
            SRC=/home/builder/lib/android-sdk-9123335
            DST=/home/builder/sdk-writable
            if [ ! -d "$DST" ]; then
              cp -a "$SRC" "$DST"
            fi
            chown -R builder:builder "$DST"
            mkdir -p "$DST/platforms" "$DST/build-tools" /tmp/sdk-install
            cd /tmp/sdk-install
            if [ ! -d "$DST/platforms/android-33" ]; then
              curl -fL --retry 5 -o platform-33.zip https://dl.google.com/android/repository/platform-33-ext3_r03.zip
              unzip -q platform-33.zip
              mv android-13 "$DST/platforms/android-33"
            fi
            if [ ! -d "$DST/build-tools/30.0.3" ]; then
              curl -fL --retry 5 -o build-tools-30.zip https://dl.google.com/android/repository/build-tools_r30.0.3-linux.zip
              unzip -q build-tools-30.zip
              mv android-11 "$DST/build-tools/30.0.3"
            fi
          '

      - name: Build bootstrap packages and archive (aarch64)
        env:
          TERMUX_DOCKER_EXEC_EXTRA_ARGS: --env ANDROID_HOME=/home/builder/sdk-writable
        run: ./scripts/run-docker.sh ./scripts/build-bootstraps.sh --architectures aarch64

      - name: Archive built debs
        run: |
          if ls output/*.deb >/dev/null 2>&1; then
            tar -czf debs-aarch64.tar.gz output/
          else
            echo "No debs found in output/, skipping debs archive."
          fi

      - name: Store bootstrap artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-aarch64
          path: |
            bootstrap-aarch64.zip
            debs-aarch64.tar.gz
          if-no-files-found: warn

      # Runs after artifact upload so a failure here never hides the built zip.
      - name: Verify bootstrap has no com.termux paths
        run: |
          set -euo pipefail
          verify_dir="$(mktemp -d)"
          python3 -c "import sys, zipfile; zipfile.ZipFile('bootstrap-aarch64.zip').extractall(sys.argv[1])" "$verify_dir"
          files=(
            "SYMLINKS.txt"
            "etc/termux/bootstrap/termux-bootstrap-second-stage.sh"
            "etc/profile.d/01-termux-bootstrap-second-stage-fallback.sh"
          )
          for file in "${files[@]}"; do
            if [ ! -f "$verify_dir/$file" ]; then
              echo "FAIL: required bootstrap file missing: '$file'" 1>&2
              exit 1
            fi
            if grep -q 'com\.termux' "$verify_dir/$file"; then
              echo "FAIL: '$file' contains com.termux:" 1>&2
              grep -n 'com\.termux' "$verify_dir/$file" | head -n 10 1>&2
              exit 1
            fi
          done
          for bin in bash dpkg apt apt-get; do
            # Symlinked commands (like apt-get) are removed from the zip and
            # only recorded in SYMLINKS.txt, so skip missing files.
            if [ -f "$verify_dir/bin/$bin" ] && strings "$verify_dir/bin/$bin" | grep -q '/data/data/com\.termux'; then
              echo "FAIL: bin/$bin contains /data/data/com.termux" 1>&2
              exit 1
            fi
          done
          total="$(grep -rl 'com\.termux' "$verify_dir" | wc -l)"
          echo "OK: SYMLINKS.txt, second stage scripts and bin/bash|dpkg|apt have 0 com.termux references (whole-zip files containing the string: $total)"
          if [ "$total" -gt 0 ]; then
            echo "Files in zip containing com.termux (informational):" 1>&2
            grep -rl 'com\.termux' "$verify_dir" | head -n 20 1>&2
          fi

  publish:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: ./release-files

      - name: Compute checksum and write bootstrap info
        run: |
          set -euo pipefail
          cd release-files
          sha256sum bootstrap-aarch64.zip > bootstrap-aarch64.zip.sha256
          {
            echo "Fable bootstrap (com.gph.fable) build info"
            echo "built_at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "commit: $GITHUB_SHA"
            echo "termux-packages import: $(git log -1 --format='%H %s')"
            echo "variant: apt-android-7"
            echo "arch: aarch64"
            echo "TERMUX_APP__PACKAGE_NAME: com.gph.fable"
            echo "TERMUX_PREFIX: /data/data/com.gph.fable/files/usr"
            echo "TERMUX_HOME: /data/data/com.gph.fable/files/home"
            echo "second_stage: /data/data/com.gph.fable/files/usr/etc/termux/bootstrap/termux-bootstrap-second-stage.sh"
            echo "zip_entries: $(python3 -c "import zipfile; print(len(zipfile.ZipFile('bootstrap-aarch64.zip').namelist()))")"
          } > bootstrap-info.txt

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          new_date_tag="bootstrap-$(date -u "+%Y.%m.%d")"
          existing_tags="$(git ls-remote --tags origin 2>/dev/null | awk '{print $2}' | sed 's#refs/tags/##' | grep -E "^${new_date_tag}-r[0-9]+\+apt-android-7$" || true)"
          if [ -n "$existing_tags" ]; then
            rev="$(printf '%s\n' "$existing_tags" | sed -E "s/^${new_date_tag}-r([0-9]+)\+apt-android-7$/\1/" | sort -n | tail -n 1)"
            rev=$((rev + 1))
          else
            rev=1
          fi
          new_tag="${new_date_tag}-r${rev}+apt-android-7"
          echo "Release tag: $new_tag"
          if gh release view "$new_tag" >/dev/null 2>&1; then
            gh release upload "$new_tag" release-files/* --clobber
          else
            gh release create "$new_tag" release-files/* \
              --title "Fable bootstrap (aarch64, apt-android-7)" \
              --notes "Bootstrap archive for com.gph.fable (TERMUX_PREFIX=/data/data/com.gph.fable/files/usr). Triggered by workflow run $GITHUB_RUN_ID."
          fi
